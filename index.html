<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>ガチャ計算ツール</title>
<style>
:root{--bg:#f6f7fb;--surface:#fff;--surface2:#f8f9fc;--text:#171a22;--muted:#707789;--line:#e7e9f0;--primary:#5267e8;--primary2:#6f7ff0;--danger:#d94b55;--success:#258a55;--shadow:0 12px 34px rgba(28,35,67,.08);--radius:20px}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:radial-gradient(circle at 10% 0,#eef1ff 0,transparent 28%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.5}
button,input{font:inherit} button{touch-action:manipulation} .app{max-width:1240px;margin:auto;padding:28px 24px 56px}.topbar{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.brand h1{font-size:clamp(26px,3vw,38px);letter-spacing:-.04em;margin:0}.brand p{margin:6px 0 0;color:var(--muted)}.top-stat{display:flex;gap:10px}.mini-stat{background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:15px;padding:10px 14px;min-width:104px}.mini-stat span{display:block;font-size:11px;color:var(--muted)}.mini-stat strong{font-size:19px}
.layout{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:22px;align-items:start}.sidebar{display:grid;gap:18px;position:sticky;top:18px}.card{background:rgba(255,255,255,.94);border:1px solid rgba(230,232,240,.9);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.card-title{display:flex;align-items:center;gap:10px;margin:0;font-size:19px}.icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#eef0ff;font-size:17px}.hint{font-size:12px;color:var(--muted)}
.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:700;color:#50576a}.input-wrap{position:relative}.input-wrap .suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);padding:11px 14px;color:var(--text);outline:none;transition:.18s}input.has-suffix{padding-right:52px}input:focus{background:#fff;border-color:#8d9af1;box-shadow:0 0 0 4px rgba(82,103,232,.1)}input::placeholder{color:#a0a6b3}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;margin:4px 0 18px}.switch-copy strong{display:block;font-size:14px}.switch-copy small{color:var(--muted)}.switch{position:relative;width:48px;height:28px;flex:0 0 auto}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:999px;background:#c9ced9;transition:.2s;cursor:pointer}.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:white;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:.2s}.switch input:checked+.slider{background:var(--primary)}.switch input:checked+.slider:before{transform:translateX(20px)}
.subhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.subhead strong{font-size:14px}.bonus-form{display:grid;grid-template-columns:1.4fr .8fr;gap:9px}.bonus-form button{grid-column:1/-1}.btn{border:0;border-radius:13px;min-height:48px;padding:11px 16px;font-weight:800;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0) scale(.99)}.btn-primary{width:100%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 8px 18px rgba(82,103,232,.2)}.btn-secondary{width:100%;background:#242938;color:#fff}.bonus-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;margin-top:9px;border:1px solid var(--line);background:#fff;border-radius:13px}.bonus-info{display:flex;align-items:center;gap:9px;min-width:0;font-size:13px}.bonus-info>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bonus-delete,.delete-btn{border:1px solid #f0dadd;background:#fff8f8;color:var(--danger);border-radius:10px;padding:8px 11px;font-weight:700;cursor:pointer;white-space:nowrap}
#message{display:none;position:fixed;z-index:50;top:18px;left:50%;transform:translateX(-50%);width:min(92vw,520px);padding:13px 16px;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.12);font-weight:700}#message.success{display:block;background:#effaf4;color:var(--success);border:1px solid #ccebd9}#message.error{display:block;background:#fff2f3;color:#b93640;border:1px solid #f2cfd2}
.list-card{min-height:520px}.list-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}.search{position:relative;flex:1}.search input{padding-left:40px;background:#fff}.search:before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:22px;color:#8a91a1;z-index:1}.user-card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:17px;margin-bottom:12px;transition:.18s}.user-card:hover{border-color:#d8dced;box-shadow:0 8px 22px rgba(31,39,72,.06)}.user-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.user-name{font-size:18px;font-weight:850;overflow-wrap:anywhere}.point-badge{background:#f0f2ff;color:#4c5fd1;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:750;white-space:nowrap}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}.result-box{background:var(--surface2);border-radius:11px;padding:9px;text-align:center}.result-label{display:block;color:var(--muted);font-size:11px}.result-value{display:block;margin-top:2px;font-size:16px;font-weight:800}.total-box{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#eef0ff,#f5f6ff);border:1px solid #e2e5ff;border-radius:12px;padding:11px 13px;margin-bottom:10px;color:#3447bc}.total-label{font-size:12px;font-weight:700}.total-value{font-size:23px;font-weight:900}.user-footer{text-align:right}.empty{text-align:center;padding:70px 12px;color:#979dac}.empty:before{content:"👥";display:block;font-size:34px;margin-bottom:8px;filter:grayscale(.4)}
@media(max-width:900px){.app{padding:20px 16px 44px}.layout{grid-template-columns:1fr}.sidebar{position:static;grid-template-columns:1fr 1fr}.list-card{min-height:0}.topbar{align-items:flex-start}.top-stat{display:none}}
@media(max-width:650px){body{background:var(--bg)}.app{padding:14px 12px 34px}.topbar{margin:5px 4px 16px}.brand h1{font-size:27px}.brand p{font-size:13px}.sidebar{grid-template-columns:1fr;gap:12px}.layout{gap:12px}.card{padding:16px;border-radius:17px;box-shadow:0 5px 18px rgba(28,35,67,.055)}.card-head{margin-bottom:14px}.card-title{font-size:17px}.bonus-form{grid-template-columns:1fr}.bonus-form button{grid-column:auto}.user-card{padding:14px}.user-header{align-items:flex-start}.result-grid{gap:6px}.result-box{padding:8px 4px}.result-value{font-size:15px}.total-value{font-size:21px}.btn,input{min-height:50px}.list-toolbar{position:sticky;top:0;z-index:5;background:rgba(246,247,251,.94);backdrop-filter:blur(8px);padding:6px 0 10px;margin-top:-4px}.bonus-item{align-items:center}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><h1>🎰 ガチャ計算ツール</h1><p>ポイントからガチャ回数をすばやく計算・共有</p></div><div class="top-stat"><div class="mini-stat"><span>参加者</span><strong id="participantCount">0人</strong></div><div class="mini-stat"><span>合計ガチャ</span><strong id="grandTotal">0回</strong></div></div></header>
<div id="message"></div>
<main class="layout">
<section class="sidebar">
<div class="card"><div class="card-head"><h2 class="card-title"><span class="icon">⚙️</span>ガチャ設定</h2><span class="hint">計算条件</span></div>
<div class="field"><label for="pointPerGacha">1回に必要なポイント</label><div class="input-wrap"><input class="has-suffix" id="pointPerGacha" type="number" min="1" inputmode="numeric" placeholder="例：200"><span class="suffix">pt</span></div></div>
<div class="switch-row"><div class="switch-copy"><strong>10回でおまけ</strong><small>通常10回につき ＋1回</small></div><label class="switch"><input id="enableBonus" type="checkbox"><span class="slider"></span></label></div>
<div class="subhead"><strong>追加項目</strong><span class="hint">必要なものだけON</span></div><div class="bonus-form"><input id="bonusName" placeholder="項目名（例：シェア）"><input id="bonusValue" type="number" min="1" inputmode="numeric" placeholder="＋回数"><button class="btn btn-secondary" onclick="addBonus()">＋ 項目を追加</button></div><div id="bonusList"></div></div>
<div class="card"><div class="card-head"><h2 class="card-title"><span class="icon">👤</span>参加者を追加</h2><span class="hint">連続登録OK</span></div><div class="field"><label for="userName">名前</label><input id="userName" autocomplete="off" placeholder="参加者の名前"></div><div class="field"><label for="userPoint">獲得ポイント</label><div class="input-wrap"><input class="has-suffix" id="userPoint" type="number" min="0" inputmode="numeric" placeholder="例：5000"><span class="suffix">pt</span></div></div><button class="btn btn-primary" onclick="addUser()">＋ 参加者を追加</button></div>
</section>
<section class="card list-card"><div class="card-head"><h2 class="card-title"><span class="icon">👥</span>参加者一覧</h2><span class="hint" id="visibleCount"></span></div><div class="list-toolbar"><div class="search"><input id="userSearch" type="search" placeholder="名前で検索" autocomplete="off"></div></div><div id="userList"><div class="empty">参加者はまだ登録されていません</div></div></section>
</main></div>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>


<script>

  /* =========================
     Firebase設定
  ========================= */

  const firebaseConfig = {

    apiKey: "AIzaSyBnNykEi3gfwkk5aJWFsFj-I3mwA6t1Rp0",

    authDomain: "gatya-1cd01.firebaseapp.com",

    databaseURL:
      "https://gatya-1cd01-default-rtdb.firebaseio.com",

    projectId: "gatya-1cd01",

    storageBucket:
      "gatya-1cd01.appspot.com",

    messagingSenderId: "34578332637",

    appId:
      "1:34578332637:web:82e5a9b85dcd09a1a69434"
  };


  firebase.initializeApp(firebaseConfig);

  const db = firebase.database();


  /* =========================
     データ
  ========================= */

  const bonusItems = {};

  // 基本設定は localStorage + Firebase の二重保存にする。
  // localStorage: 入力直後のリロードでも確実に復元
  // Firebase: 別端末とも設定を共有
  const basicSettingsRef = db.ref("settings/basic");
  const pointPerGachaInput = document.getElementById("pointPerGacha");
  const enableBonusInput = document.getElementById("enableBonus");
  const POINT_STORAGE_KEY = "gacha_pointPerGacha";
  const BONUS_STORAGE_KEY = "gacha_enableBonus";
  let pointSaveTimer = null;

  // Firebaseより先に、端末内に保存済みの値を即時復元する
  const savedPoint = localStorage.getItem(POINT_STORAGE_KEY);
  if (savedPoint !== null && savedPoint !== "" && Number(savedPoint) > 0) {
    pointPerGachaInput.value = savedPoint;
  }

  const savedBonus = localStorage.getItem(BONUS_STORAGE_KEY);
  if (savedBonus !== null) {
    enableBonusInput.checked = savedBonus === "true";
  }

  // Firebaseの値が取得できたら、画面とlocalStorageも同期する
  basicSettingsRef.on("value", snapshot => {
    const settings = snapshot.val() || {};

    if (settings.pointPerGacha !== undefined &&
        settings.pointPerGacha !== null &&
        Number(settings.pointPerGacha) > 0) {
      pointPerGachaInput.value = settings.pointPerGacha;
      localStorage.setItem(POINT_STORAGE_KEY, String(settings.pointPerGacha));
    }

    if (settings.enableBonus !== undefined) {
      enableBonusInput.checked = settings.enableBonus === true;
      localStorage.setItem(BONUS_STORAGE_KEY, String(enableBonusInput.checked));
    }
  }, error => {
    // Firebaseが読めなくてもlocalStorageの値はそのまま利用できる
    console.error("基本設定の読み込みエラー:", error);
  });

  // 入力するたびに端末へ即時保存。Firebaseは連続書き込み防止のため少し遅らせる
  pointPerGachaInput.addEventListener("input", () => {
    const raw = pointPerGachaInput.value;
    const value = Number(raw);

    if (raw !== "" && value > 0) {
      localStorage.setItem(POINT_STORAGE_KEY, raw);

      clearTimeout(pointSaveTimer);
      pointSaveTimer = setTimeout(() => {
        basicSettingsRef.update({ pointPerGacha: value }).catch(error => {
          console.error("必要ポイントのFirebase保存エラー:", error);
        });
      }, 350);
    } else if (raw === "") {
      localStorage.removeItem(POINT_STORAGE_KEY);
    }
  });

  // フォーカスを外した時は待たずにFirebaseへ保存
  pointPerGachaInput.addEventListener("blur", () => {
    clearTimeout(pointSaveTimer);
    const value = Number(pointPerGachaInput.value);
    if (pointPerGachaInput.value !== "" && value > 0) {
      localStorage.setItem(POINT_STORAGE_KEY, String(value));
      basicSettingsRef.update({ pointPerGacha: value }).catch(error => {
        console.error("必要ポイントのFirebase保存エラー:", error);
      });
    }
  });

  enableBonusInput.addEventListener("change", () => {
    localStorage.setItem(BONUS_STORAGE_KEY, String(enableBonusInput.checked));
    basicSettingsRef.update({ enableBonus: enableBonusInput.checked }).catch(error => {
      console.error("おまけ設定の保存エラー:", error);
    });
  });

  // 追加項目はFirebaseへ保存し、リロード・別端末でも共有する
  const bonusRef = db.ref("settings/bonusItems");

  bonusRef.on("value", snapshot => {
    const data = snapshot.val() || {};

    Object.keys(bonusItems).forEach(key => delete bonusItems[key]);
    Object.entries(data).forEach(([key, item]) => {
      bonusItems[key] = {
        name: item.name || key,
        value: Number(item.value) || 0,
        enabled: item.enabled !== false
      };
    });

    renderBonusList();
  }, error => {
    console.error("追加項目の読み込みエラー:", error);
    showMessage("追加項目を読み込めませんでした。", "error");
  });


  /* =========================
     メッセージ
  ========================= */

  function showMessage(text, type = "success") {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className = type;

    setTimeout(() => {

      message.style.display = "none";

    }, 3000);
  }


  /* =========================
     追加項目
  ========================= */

  async function addBonus() {

    const name = document.getElementById("bonusName").value.trim();
    const value = Number(document.getElementById("bonusValue").value);

    if (!name || value <= 0) {
      showMessage("項目名と増える回数を入力してください", "error");
      return;
    }

    // Firebaseのキーに項目名を直接使わず push() で安全なIDを作る
    const itemRef = bonusRef.push();

    try {
      await itemRef.set({
        name: name,
        value: value,
        enabled: true,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      });

      document.getElementById("bonusName").value = "";
      document.getElementById("bonusValue").value = "";
      showMessage("追加項目を保存しました");
    } catch (error) {
      console.error("追加項目の保存エラー:", error);
      showMessage("追加項目の保存に失敗しました。", "error");
    }
  }


  function renderBonusList() {

    const div = document.getElementById("bonusList");
    div.innerHTML = "";

    Object.entries(bonusItems).forEach(([id, item]) => {

      const itemDiv = document.createElement("div");
      itemDiv.className = "bonus-item";

      itemDiv.innerHTML = `
        <div class="bonus-info">
          <label class="switch">
            <input type="checkbox" ${item.enabled ? "checked" : ""}>
            <span class="slider"></span>
          </label>
          <span>${escapeHtml(item.name)}：+${item.value}回</span>
        </div>
        <button class="bonus-delete">削除</button>
      `;

      const checkbox = itemDiv.querySelector('input[type="checkbox"]');
      checkbox.addEventListener("change", async function() {
        try {
          await bonusRef.child(id).update({ enabled: this.checked });
        } catch (error) {
          console.error("追加項目の更新エラー:", error);
          showMessage("ON/OFFの保存に失敗しました。", "error");
        }
      });

      const deleteButton = itemDiv.querySelector(".bonus-delete");
      deleteButton.addEventListener("click", async function() {
        if (!confirm(`「${item.name}」を削除しますか？`)) return;

        try {
          await bonusRef.child(id).remove();
          showMessage("追加項目を削除しました");
        } catch (error) {
          console.error("追加項目の削除エラー:", error);
          showMessage("追加項目の削除に失敗しました。", "error");
        }
      });

      div.appendChild(itemDiv);
    });
  }



  /* =========================
     参加者追加
  ========================= */

  async function addUser() {

    const name =
      document
        .getElementById("userName")
        .value
        .trim();


    const point =
      Number(
        document.getElementById("userPoint").value
      );


    const pointPerGacha =
      Number(
        document
          .getElementById("pointPerGacha")
          .value
      );


    const enableBonus =
      document
        .getElementById("enableBonus")
        .checked;


    /* 入力チェック */

    if (!name) {

      alert("名前を入力してください");

      return;

    }


    if (
      document.getElementById("userPoint").value === ""
      ||
      point < 0
    ) {

      alert("獲得ポイントを入力してください");

      return;

    }


    if (!pointPerGacha || pointPerGacha <= 0) {

      alert("1回に必要なポイントを入力してください");

      return;

    }


    /* =========================
       ガチャ計算
    ========================= */

    const normal =
      Math.floor(
        point / pointPerGacha
      );


    const bonusGacha =
      enableBonus
        ? Math.floor(normal / 10)
        : 0;


    let extra = 0;


    Object.values(bonusItems).forEach(
      item => {

        if (item.enabled) {

          extra += item.value;

        }

      }
    );


    const total =
      normal +
      bonusGacha +
      extra;


    /* =========================
       Firebase保存
       push()を使用
    ========================= */

    const userRef =
      db.ref("users").push();


    const userData = {

      name: name,

      point: point,

      normal: normal,

      bonusGacha: bonusGacha,

      extra: extra,

      total: total,

      createdAt:
        firebase.database.ServerValue.TIMESTAMP

    };


    try {

      await userRef.set(userData);


      /* 入力欄をクリア */

      document
        .getElementById("userName")
        .value = "";

      document
        .getElementById("userPoint")
        .value = "";


      showMessage(
        "参加者を追加しました"
      );


    } catch (error) {

      console.error(
        "Firebase保存エラー:",
        error
      );


      showMessage(
        "保存に失敗しました。FirebaseのDatabaseルールを確認してください。",
        "error"
      );

    }

  }


  /* =========================
     参加者削除
  ========================= */

  async function deleteUser(id, name) {

    const result =
      confirm(
        `「${name}」を削除しますか？`
      );


    if (!result) {

      return;

    }


    try {

      await db
        .ref("users/" + id)
        .remove();


      showMessage(
        "参加者を削除しました"
      );


    } catch (error) {

      console.error(
        "Firebase削除エラー:",
        error
      );


      showMessage(
        "削除に失敗しました",
        "error"
      );

    }

  }


  /* =========================
     参加者一覧
  ========================= */

  db.ref("users").on(
    "value",
    snapshot => {

      const data =
        snapshot.val() || {};


      const div =
        document.getElementById("userList");


      div.innerHTML = "";


      const users =
        Object.entries(data);


      if (users.length === 0) {

        div.innerHTML = `
          <div class="empty">
            参加者はまだ登録されていません
          </div>
        `;

        return;

      }


      /* 新しい順 */

      users.sort(
        (a, b) => {

          const timeA =
            a[1].createdAt || 0;

          const timeB =
            b[1].createdAt || 0;

          return timeB - timeA;

        }
      );


      users.forEach(
        ([id, u]) => {

          const card =
            document.createElement("div");

          card.className =
            "user-card";


          card.innerHTML = `

            <div class="user-header">

              <div class="user-name">
                ${escapeHtml(u.name)}
              </div>

              <div class="point-badge">
                ${formatNumber(u.point)} pt
              </div>

            </div>


            <div class="result-grid">

              <div class="result-box">

                <span class="result-label">
                  通常
                </span>

                <span class="result-value">
                  ${u.normal}回
                </span>

              </div>


              <div class="result-box">

                <span class="result-label">
                  おまけ
                </span>

                <span class="result-value">
                  ${u.bonusGacha}回
                </span>

              </div>


              <div class="result-box">

                <span class="result-label">
                  追加
                </span>

                <span class="result-value">
                  ${u.extra}回
                </span>

              </div>

            </div>


            <div class="total-box">

              <span class="total-label">
                合計ガチャ回数
              </span>

              <span class="total-value">
                ${u.total}回
              </span>

            </div>


            <div class="user-footer">

              <button
                class="delete-btn"
                data-id="${id}"
                data-name="${escapeHtml(u.name)}"
              >
                🗑 削除
              </button>

            </div>

          `;


          /* 削除ボタン */

          const deleteButton =
            card.querySelector(
              ".delete-btn"
            );


          deleteButton.addEventListener(
            "click",
            function() {

              deleteUser(
                this.dataset.id,
                this.dataset.name
              );

            }
          );


          div.appendChild(card);

        }
      );

    },

    error => {

      console.error(
        "Firebase読み込みエラー:",
        error
      );


      showMessage(
        "Firebaseからデータを読み込めません。Databaseルールを確認してください。",
        "error"
      );

    }
  );


  /* =========================
     XSS対策
  ========================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     数字表示
  ========================= */

  function formatNumber(value) {

    return Number(value).toLocaleString("ja-JP");

  }

</script>


<script>
(function(){
  const search=document.getElementById('userSearch');
  const list=document.getElementById('userList');
  function refreshUI(){
    const cards=[...list.querySelectorAll('.user-card')];
    let total=0; cards.forEach(c=>{ const v=c.querySelector('.total-value'); if(v) total+=Number((v.textContent.match(/[\d,]+/)||['0'])[0].replace(/,/g,'')); });
    document.getElementById('participantCount').textContent=cards.length+'人';
    document.getElementById('grandTotal').textContent=total.toLocaleString('ja-JP')+'回';
    filter();
  }
  function filter(){
    const q=(search.value||'').trim().toLowerCase(); let visible=0;
    [...list.querySelectorAll('.user-card')].forEach(c=>{const name=(c.querySelector('.user-name')?.textContent||'').toLowerCase();const show=!q||name.includes(q);c.style.display=show?'':'none';if(show)visible++;});
    const all=list.querySelectorAll('.user-card').length; document.getElementById('visibleCount').textContent=all?(q?visible+' / '+all+'人':all+'人'):'';
  }
  search.addEventListener('input',filter);
  new MutationObserver(refreshUI).observe(list,{childList:true,subtree:true});
  document.getElementById('userName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('userPoint').focus();});
  document.getElementById('userPoint').addEventListener('keydown',e=>{if(e.key==='Enter')addUser();});
  refreshUI();
})();
</script>
</body>
</html>
