<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ガチャ計算ツール</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 800px;
    margin: auto;
    padding: 20px;
    background: #f7f7f7;
  }
  h1, h2 { text-align: center; }
  .card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  input, button {
    font-size: 18px;
    padding: 10px;
    margin: 5px 0;
    width: 100%;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  button {
    background: #2196F3;
    color: white;
    cursor: pointer;
  }

  /* スイッチ風チェックボックス */
  .switch {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 26px;
    margin-right: 10px;
  }
  .switch input { display: none; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0;
    right: 0; bottom: 0;
    background-color: #ccc;
    transition: .3s;
    border-radius: 26px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 20px; width: 20px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }
  input:checked + .slider {
    background-color: #4CAF50;
  }
  input:checked + .slider:before {
    transform: translateX(24px);
  }

  .deleteBtn {
    background: #F44336;
    color: white;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    width: auto;
    margin-top: 10px;
  }

  /* 追加項目を縦並びにする */
  .bonus-item {
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<h1>ガチャ計算ツール</h1>

<!-- ガチャ設定 -->
<div class="card">
  <h2>ガチャ設定</h2>

  <input id="pointPerGacha" type="number" placeholder="1回に必要なポイント（例：200）">

  <label>
    <span class="switch">
      <input id="enableBonus" type="checkbox">
      <span class="slider"></span>
    </span>
    10回でおまけをつける（+1回）
  </label>

  <h3>追加項目（シェア・バッチなど）</h3>
  <input id="bonusName" placeholder="項目名（例：シェア）">
  <input id="bonusValue" type="number" placeholder="1つにつき増える回数（例：1）">
  <button onclick="addBonus()">項目を追加</button>

  <div id="bonusList"></div>
</div>

<!-- 参加者追加 -->
<div class="card">
  <h2>参加者を追加</h2>
  <input id="userName" placeholder="名前">
  <input id="userPoint" type="number" placeholder="獲得ポイント">
  <button onclick="addUser()">追加する</button>
</div>

<!-- 結果 -->
<div class="card">
  <h2>参加者一覧</h2>
  <div id="userList"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBnNykEi3gfwkk5aJWFsFj-I3mwA6t1Rp0",
    authDomain: "gatya-1cd01.firebaseapp.com",
    databaseURL: "https://gatya-1cd01-default-rtdb.firebaseio.com",
    projectId: "gatya-1cd01",
    storageBucket: "gatya-1cd01.appspot.com",
    messagingSenderId: "34578332637",
    appId: "1:34578332637:web:82e5a9b85dcd09a1a69434"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const bonusItems = {};

  function addBonus() {
    const name = document.getElementById("bonusName").value;
    const value = Number(document.getElementById("bonusValue").value);

    if (!name || !value) return alert("項目名と値を入力してください");

    bonusItems[name] = { value, enabled: true };

    renderBonusList();
  }

  function renderBonusList() {
    const div = document.getElementById("bonusList");
    div.innerHTML = "";

    Object.entries(bonusItems).forEach(([name, item]) => {
      div.innerHTML += `
        <div class="bonus-item">
          <span class="switch">
            <input type="checkbox" id="bonusEnable_${name}" checked onchange="toggleBonus('${name}')">
            <span class="slider"></span>
          </span>
          ${name}：+${item.value}回
        </div>
      `;
    });
  }

  function toggleBonus(name) {
    bonusItems[name].enabled = document.getElementById(`bonusEnable_${name}`).checked;
  }

  function addUser() {
    const name = document.getElementById("userName").value;
    const point = Number(document.getElementById("userPoint").value);
    const pointPerGacha = Number(document.getElementById("pointPerGacha").value);
    const enableBonus = document.getElementById("enableBonus").checked;

    if (!name || !point || !pointPerGacha) {
      alert("名前・ポイント・ガチャ設定を入力してください");
      return;
    }

    const normal = Math.floor(point / pointPerGacha);
    const bonusGacha = enableBonus ? Math.floor(normal / 10) : 0;

    let extra = 0;
    Object.entries(bonusItems).forEach(([name, item]) => {
      if (item.enabled) extra += item.value;
    });

    const total = normal + bonusGacha + extra;

    db.ref("users/" + name).set({
      name,
      point,
      normal,
      bonusGacha,
      extra,
      total
    });
  }

  function deleteUser(name) {
    db.ref("users/" + name).remove();
  }

  db.ref("users").on("value", snapshot => {
    const data = snapshot.val() || {};
    const div = document.getElementById("userList");
    div.innerHTML = "";

    Object.values(data).forEach(u => {
      div.innerHTML += `
        <div class="card">
          <strong>${u.name}</strong><br>
          ポイント：${u.point}<br>
          通常：${u.normal}回<br>
          おまけ：${u.bonusGacha}回<br>
          追加：${u.extra}回<br>
          <h3>合計：${u.total}回</h3>
          <button class="deleteBtn" onclick="deleteUser('${u.name}')">削除</button>
        </div>
      `;
    });
  });
</script>

</body>
</html>
